<!doctype html>
<html><head><meta charset="utf-8"><title>interiors test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfd8d6}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import * as A from './src/arch.js';
import { MAT } from './src/arch.js';
import { furnish, placeInteriorModels } from './src/interiors.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#b9d0dc');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.2;
scene.add(new THREE.HemisphereLight('#dfe9f0', '#5d6640', 0.9));
const sun = new THREE.DirectionalLight('#fff3dd', 2.4); sun.position.set(80, 120, 140); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 60, bottom: -60, near: 10, far: 500 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 120), new THREE.MeshStandardMaterial({ color: '#6d8a3e' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const ROOMS = {
  xiaoxiang: { opt: { w: 10, d: 6, h: 3.3, bays: 3, roofType: 'juanpeng', colMat: MAT.columnGreen, latticeMat: MAT.latticeGreen, hangMat: MAT.hangLatticeGreen, sillMat: MAT.wall }, platform: 0.6 },
  qiushuang: { opt: { w: 12, d: 7, h: 3.8, bays: 3, roofType: 'xieshan' }, platform: 0.6 },
  hengwu: { opt: { w: 15, d: 7, h: 3.5, bays: 5, roofType: 'juanpeng', corridor: 1.4, latticeMat: MAT.latticeGreen, colMat: MAT.columnGreen }, platform: 0.6 },
  yihong: { opt: { w: 17, d: 8, h: 3.8, bays: 5, roofType: 'xieshan', lanterns: 'palace' }, platform: 0.6 },
  daoxiang: { opt: { w: 11, d: 5.5, h: 2.7, bays: 3, roofType: 'thatch', roofMat: MAT.thatch, colMat: MAT.columnPlain, beamMat: MAT.beamPlain, wallMat: MAT.wallMud, platform: 0.3, platMat: MAT.wallMud, roofH: 2.8, rustic: true, steps: false }, platform: 0.3 },
  zhengdian: { opt: { w: 26, d: 12, h: 5.2, bays: 7, roofType: 'xieshan', dougong: true, platform: 1.4, platMat: MAT.marble, lanterns: 'palace', roofH: 5.2 }, platform: 1.4 },
};
const root = new THREE.Group(); scene.add(root);
const pos = {}; let x = -130;
for (const [id, r] of Object.entries(ROOMS)) {
  const hall = A.hall({ platform: r.platform, ...r.opt });
  const wx = x + r.opt.w / 2; x += r.opt.w + 14;
  hall.position.set(wx, 0, 0); root.add(hall);
  furnish(id, hall, { w: r.opt.w, d: r.opt.d, h: r.opt.h, platform: r.platform });
  pos[id] = { x: wx, ...r.opt, platform: r.platform };
}
root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 1000);
let calls = 0;
window.__it = {
  ready: false,
  view(id, kind) {
    const p = pos[id], y = p.platform + 1.6;
    if (kind === 'in') { camera.position.set(p.x + 0.4, y, p.d / 2 - 1.3); camera.lookAt(p.x - p.w * 0.08, y - 0.35, -p.d / 2); }
    else if (kind === 'in2') { camera.position.set(p.x - p.w / 2 + 0.7, y, p.d / 2 - 1.2); camera.lookAt(p.x + p.w / 4, y - 0.4, -p.d / 4); }
    else if (kind === 'west') { camera.position.set(p.x + p.w * 0.2, y, 0); camera.lookAt(p.x - p.w / 2, y, 0); }
    else { camera.position.set(p.x + 1.2, y + 0.2, p.d / 2 + 4.5); camera.lookAt(p.x, y - 0.2, -p.d / 2); }
    renderer.render(scene, camera);
    return renderer.info.render;
  },
};
placeInteriorModels(root, scene).then((g) => {
  let tris = 0; g.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  window.__it.modelTris = tris; window.__it.ready = true;
});
function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); }
camera.position.set(0, 40, 80); camera.lookAt(0, 0, 0); loop();
</script></body></html>
